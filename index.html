<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Súper</title>
<meta name="theme-color" content="#1f7a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Súper">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<style>
:root {
  --bg:#f6f5f1; --surface:#ffffff; --text:#1c1b18; --muted:#6b6a63; --line:#e5e3db;
  --accent:#1f7a4d; --accent-ink:#ffffff; --accent-soft:#e3f1ea;
  --danger:#b3261e; --warn:#7a5200; --warn-bg:#fff1cc;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#141412; --surface:#1e1e1b; --text:#efeee8; --muted:#9c9b92; --line:#33332e;
    --accent:#4cc58a; --accent-ink:#0b1f15; --accent-soft:#1c2e25;
    --danger:#ff8a80; --warn:#f3c969; --warn-bg:#3a2f12;
  }
}
:root[data-theme="dark"] {
  --bg:#141412; --surface:#1e1e1b; --text:#efeee8; --muted:#9c9b92; --line:#33332e;
  --accent:#4cc58a; --accent-ink:#0b1f15; --accent-soft:#1c2e25;
  --danger:#ff8a80; --warn:#f3c969; --warn-bg:#3a2f12;
}
html { scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%; }
.wrap { max-width:720px; margin:0 auto; padding:18px 16px 120px; }
h1 { font-size:22px; margin:0 0 2px; letter-spacing:-.01em; }
h2 { font-size:17px; margin:0 0 12px; }
h3 { font-size:14px; margin:0 0 10px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
button { font:inherit; color:inherit; cursor:pointer; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:12px; padding:12px 16px; font-weight:600; background:var(--accent); color:var(--accent-ink); min-height:46px; }
.btn.big { width:100%; padding:18px; font-size:17px; }
.btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
.btn.danger { background:transparent; color:var(--danger); border:1px solid var(--danger); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.stack { display:flex; flex-direction:column; gap:10px; }
.row { display:flex; gap:10px; }
.row > * { flex:1; min-width:0; }
label { display:block; font-size:13px; color:var(--muted); }
input, select, textarea { width:100%; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-height:44px; margin-top:4px; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; }
.chip { flex:none; border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:8px 14px; font-size:14px; }
.chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
.kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
.kpi { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; }
.kpi b { display:block; font-size:19px; letter-spacing:-.01em; }
.kpi span { font-size:12px; color:var(--muted); }
.insight { background:var(--accent-soft); border-radius:14px; padding:12px 14px; margin-bottom:12px; font-size:15px; }
.bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:6px; }
.bar > i { display:block; height:100%; border-radius:99px; }
.line { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
.line .n { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.line .v { font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
.small { font-size:12px; color:var(--muted); }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }
.catrow { display:block; width:100%; text-align:left; background:none; border:0; padding:8px 0; border-bottom:1px solid var(--line); }
.catrow:last-child { border-bottom:0; }
.catrow[aria-pressed="true"] { background:var(--accent-soft); border-radius:10px; padding-left:8px; padding-right:8px; }
.prod { padding:8px 0; border-bottom:1px solid var(--line); }
.prod:last-child { border-bottom:0; }
.trend { display:flex; align-items:flex-end; gap:8px; height:110px; }
.trend > div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
.trend i { display:block; width:100%; max-width:38px; background:var(--accent); border-radius:6px 6px 0 0; min-height:2px; }
.trend span { font-size:11px; color:var(--muted); margin-top:4px; }
.hist { display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px; }
.item { border-top:1px solid var(--line); padding:10px 0; transition:background-color .3s; border-radius:10px; }
.item.focus { background:var(--accent-soft); }
.item:first-child { border-top:0; }
textarea { min-height:140px; resize:vertical; font-size:13px; }
.pbtn { display:block; width:100%; text-align:left; background:none; border:0; padding:0; }
.cathead { display:flex; align-items:center; gap:10px; width:100%; background:none; border:0; padding:4px 0; text-align:left; }
.cathead b { font-size:16px; flex:1; }
.chev { width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(-45deg); transition:transform .15s; flex:none; margin:0 4px 0 2px; }
.cathead[aria-expanded="true"] .chev { transform:rotate(45deg); }
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:14px 12px; margin-top:12px; }
.tile { display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:0; padding:0; text-align:center; min-width:0; }
.timg { display:flex; align-items:center; justify-content:center; width:100%; aspect-ratio:1/1; border-radius:14px; background:#f4f2ec; overflow:hidden; }
.timg svg { width:86%; height:86%; display:block; }
.tname { font-size:13px; line-height:1.2; max-width:100%; overflow-wrap:anywhere; }
.tile[aria-pressed="true"] .timg { outline:2px solid var(--accent); outline-offset:2px; }
.sheetwrap { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:var(--surface); width:100%; max-width:720px; max-height:84vh; overflow:auto; border-radius:18px 18px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px)); }
.sheethead { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.sheethead .timg { width:60px; flex:none; border-radius:12px; }
.sheethead h2 { margin:0; flex:1; min-width:0; overflow-wrap:anywhere; }
.pbtn[aria-pressed="true"] .n { color:var(--accent); font-weight:700; }
.buys { margin:8px 0 2px; }
.buy { display:flex; justify-content:space-between; gap:10px; width:100%; text-align:left; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px; font-size:14px; }
.buy b { font-variant-numeric:tabular-nums; white-space:nowrap; }
.unitline { font-size:12px; color:var(--muted); margin-top:2px; }
.pricebox { display:block; width:100%; text-align:left; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:6px; -webkit-appearance:none; appearance:none; }
.pricebox .up { display:flex; justify-content:space-between; gap:10px; font-size:14px; }
.pricebox .up b { font-variant-numeric:tabular-nums; white-space:nowrap; }
.pricebox.best b { color:var(--accent); }
.pricebox.worst b { color:var(--danger); }
.search { width:100%; }
.item .r2 { display:grid; grid-template-columns:64px 92px 1fr 44px; gap:8px; margin-top:6px; }
.item .r2 input, .item .r2 select { margin-top:0; }
.item .gen { margin-top:6px; }
.item .gen input { min-height:38px; font-size:14px; }
.icon { border:1px solid var(--line); background:transparent; border-radius:10px; min-height:44px; color:var(--muted); }
.totalbar { display:flex; justify-content:space-between; align-items:center; font-size:18px; padding:12px 0 4px; }
.warn { background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:10px 12px; font-size:14px; margin:8px 0; }
.warn:empty { display:none; }
.err { background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:12px 14px; margin-bottom:12px; font-size:14px; }
.spin { width:38px; height:38px; border-radius:50%; border:4px solid var(--line); border-top-color:var(--accent); animation:sp 0.9s linear infinite; margin:8px auto 14px; }
@keyframes sp { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration:3s; } }
.center { text-align:center; }
.nav { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; gap:4px; background:var(--surface); border-top:1px solid var(--line); padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px)); }
.nav button { flex:1; background:none; border:0; border-radius:12px; padding:8px 4px; font-size:12px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; }
.nav button span { font-size:20px; line-height:1; }
.nav button[aria-current="page"] { color:var(--accent); font-weight:700; background:var(--accent-soft); }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(86px + env(safe-area-inset-bottom,0px)); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:99px; font-size:14px; z-index:9; max-width:90%; }
.toast:empty { display:none; }
.empty { text-align:center; padding:28px 12px; }
.empty .big { font-size:44px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛒 Mi Súper</h1>
  <p class="sub">Tus gastos del supermercado, ítem por ítem.</p>
  <main id="main"></main>
</div>

<nav class="nav" aria-label="Secciones">
  <button data-tab="resumen"><span>📊</span>Resumen</button>
  <button data-tab="escanear"><span>📷</span>Agregar</button>
  <button data-tab="historial"><span>🧾</span>Historial</button>
  <button data-tab="precios"><span>🏷️</span>Precios</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" multiple hidden>
<input type="file" id="restore" accept="application/json,.json" hidden>

<script>
(function () {
  "use strict";

  var CATS = ["Frutas y verduras","Carnes y pescados","Lácteos y huevos","Panadería","Despensa","Bebidas","Snacks y dulces","Congelados","Limpieza del hogar","Cuidado personal","Mascotas","Otros"];
  var COLORS = ["#3f9c5a","#c8553d","#e0a526","#b98a5c","#8b6bb8","#3b8fd0","#e0709a","#5bb5c9","#6f8f3d","#d98b3a","#8a7a6a","#a0a0a0"];
  var PAYMENTS = ["VISA Jose","VISA Irina","Efectivo","VALE"];
  var KEY = "misuper:v1", CODE_KEY = "misuper:code";

  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function num(v, d) { var n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? d : n; }
  function r2(n) { return Math.round(n * 100) / 100; }
  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function isDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || "")); }
  function money(n) { n = Number(n) || 0; var s = Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (n < 0 ? "-" : "") + "$" + s; }
  function fdate(s) { var d = new Date(s + "T00:00:00"); return isNaN(d) ? s : d.toLocaleDateString("es", { day: "numeric", month: "short", year: "numeric" }); }
  function fdateShort(s) {
    var d = new Date(s + "T00:00:00"); if (isNaN(d)) return s;
    return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getFullYear() % 100).padStart(2, "0");
  }
  function norm(s) { return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase(); }
  function stem(w) {
    if (w.length > 4 && /[nlrzdj]es$/.test(w)) return w.slice(0, -2);
    if (w.length > 3 && w.charAt(w.length - 1) === "s") return w.slice(0, -1);
    return w;
  }
  function pkey(label) { return norm(label).split(/\s+/).map(stem).join(" "); }
  function catColor(c) { var i = CATS.indexOf(c); return COLORS[i < 0 ? CATS.length - 1 : i]; }
  function fdateDM(s) { var d = new Date(s + "T00:00:00"); return isNaN(d) ? s : d.toLocaleDateString("es", { day: "numeric", month: "short" }); }

  function corteRange(ref) {
    var d = ref || new Date(), y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
    if (day < 15) { m -= 1; if (m < 0) { m = 11; y -= 1; } }
    var start = new Date(y, m, 15), end = new Date(y, m + 1, 14);
    function f(dt) { return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0"); }
    return { start: f(start), end: f(end) };
  }

  var VALE_KEY = "misuper:vale";
  function loadVale() {
    try { var v = JSON.parse(localStorage.getItem(VALE_KEY)); return (v && v.anchorDate) ? v : null; } catch (e) { return null; }
  }
  function persistVale(v) { try { localStorage.setItem(VALE_KEY, JSON.stringify(v)); } catch (e) {} }
  function cleanVale(v) {
    v = v || {};
    var ab = Number(v.anchorBalance), ra = Number(v.rechargeAmount), rd = parseInt(v.rechargeDay, 10);
    if (!isDate(v.anchorDate) || isNaN(ab)) return null;
    return { anchorDate: v.anchorDate, anchorBalance: r2(ab), rechargeAmount: ra > 0 ? r2(ra) : 0, rechargeDay: (rd >= 1 && rd <= 28) ? rd : 18 };
  }
  function countRecharges(fromExclusive, toInclusive, day) {
    var from = new Date(fromExclusive + "T00:00:00"), to = new Date(toInclusive + "T00:00:00");
    var d = new Date(from.getFullYear(), from.getMonth(), day);
    if (d <= from) d = new Date(d.getFullYear(), d.getMonth() + 1, day);
    var n = 0;
    while (d <= to) { n++; d = new Date(d.getFullYear(), d.getMonth() + 1, day); }
    return n;
  }
  function valeBalanceAsOf(dateStr) {
    var v = state.vale; if (!v) return null;
    var recharged = countRecharges(v.anchorDate, dateStr, v.rechargeDay) * v.rechargeAmount;
    var spent = 0;
    state.purchases.forEach(function (p) { if (p.payment === "VALE" && p.date >= v.anchorDate && p.date <= dateStr) spent += purchaseTotal(p); });
    return r2(v.anchorBalance + recharged - spent);
  }
  function nextRechargeDate(dateStr) {
    var v = state.vale; if (!v) return null;
    var d = new Date(dateStr + "T00:00:00"), r = new Date(d.getFullYear(), d.getMonth(), v.rechargeDay);
    if (r <= d) r = new Date(r.getFullYear(), r.getMonth() + 1, v.rechargeDay);
    return r.getFullYear() + "-" + String(r.getMonth() + 1).padStart(2, "0") + "-" + String(r.getDate()).padStart(2, "0");
  }

  function load() { try { var r = localStorage.getItem(KEY); var a = r ? JSON.parse(r) : []; return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function getCode() { try { return localStorage.getItem(CODE_KEY) || ""; } catch (e) { return ""; } }
  function setCode(c) { try { if (c) localStorage.setItem(CODE_KEY, c); else localStorage.removeItem(CODE_KEY); } catch (e) {} }
  var toastTimer;
  function toast(msg) { var t = $("#toast"); t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.textContent = ""; }, 2800); }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state.purchases)); } catch (e) { toast("No se pudo guardar en este navegador"); } }

  var SYNC_KEY = "misuper:synced", PEND_KEY = "misuper:pending";
  function isSynced() { try { return !!localStorage.getItem(SYNC_KEY); } catch (e) { return false; } }
  function markSynced() { try { localStorage.setItem(SYNC_KEY, "1"); } catch (e) {} }
  function getPend() { try { var p = JSON.parse(localStorage.getItem(PEND_KEY)); return { s: (p && p.s) || [], d: (p && p.d) || [] }; } catch (e) { return { s: [], d: [] }; } }
  function setPend(p) { try { localStorage.setItem(PEND_KEY, JSON.stringify(p)); } catch (e) {} }
  function validPurchase(p) { return p && p.id && isDate(p.date) && Array.isArray(p.items); }
  function chunk(arr, n) { var out = []; for (var i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; }

  var state = { tab: "resumen", period: "mes", cat: null, prod: null, pay: null, priceQuery: "", pcmp: null, pcols: {}, purchases: load(), draft: null, scan: null, scanError: "", confirmWipe: false, code: getCode(), editCode: false, pasting: false, sync: "off", syncing: false, vale: loadVale(), valeEdit: false, valeSynced: false };

  // ---------- Sincronización entre dispositivos (vía /api/data) ----------
  function api(op, payload) {
    return fetch("/api/data", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(Object.assign({ op: op, code: state.code }, payload || {})) }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.error || "http"); e.code = j.error; e.status = r.status; throw e; }
        return j;
      });
    });
  }
  function handleSyncErr(e) {
    if (e && e.code === "nostore") state.sync = "nostore";
    else if (e && e.code === "code") { state.code = ""; setCode(""); state.sync = "off"; toast("El código de acceso es incorrecto"); }
    else state.sync = "error";
  }
  function flush() {
    var pend = getPend();
    if (!pend.s.length && !pend.d.length) return Promise.resolve();
    var saves = state.purchases.filter(function (p) { return pend.s.indexOf(p.id) >= 0; });
    var chain = Promise.resolve();
    chunk(saves, 50).forEach(function (c) { chain = chain.then(function () { return api("bulk", { purchases: c }); }); });
    if (pend.d.length) chain = chain.then(function () { return api("delete_many", { ids: pend.d }); });
    return chain.then(function () {
      var cur = getPend();
      setPend({ s: cur.s.filter(function (x) { return pend.s.indexOf(x) < 0; }), d: cur.d.filter(function (x) { return pend.d.indexOf(x) < 0; }) });
    });
  }
  function syncNow() {
    if (!state.code || state.syncing || state.sync === "nostore") return Promise.resolve();
    state.syncing = true;
    var first = !isSynced();
    return flush().then(function () { return api("list"); }).then(function (res) {
      var server = (res.purchases || []).filter(validPurchase), sids = {};
      server.forEach(function (p) { sids[p.id] = true; });
      var extra = first ? state.purchases.filter(function (p) { return validPurchase(p) && !sids[p.id]; }) : [];
      var up = Promise.resolve();
      chunk(extra, 50).forEach(function (c) { up = up.then(function () { return api("bulk", { purchases: c }); }); });
      return up.then(function () {
        markSynced();
        var pend = getPend();
        var keepLocal = state.purchases.filter(function (p) { return pend.s.indexOf(p.id) >= 0 && !sids[p.id]; });
        var merged = server.filter(function (p) { return pend.d.indexOf(p.id) < 0; }).concat(extra, keepLocal.filter(function (p) { return extra.indexOf(p) < 0; }));
        state.purchases = merged; persist(); state.sync = "ok";
      });
    }).then(function () {
      return api("get_settings").then(function (res) {
        var srv = cleanVale(res && res.settings);
        if (srv) { state.vale = srv; persistVale(srv); }
        else if (state.vale && !state.valeSynced) { return api("set_settings", { settings: state.vale }).catch(function () {}); }
      }).catch(function () {}).then(function () { state.valeSynced = true; });
    }).catch(handleSyncErr).then(function () { state.syncing = false; tryOpenHash(); if (!state.draft && !state.scan) render(); });
  }
  function trySync() {
    if (!state.code || state.sync === "nostore") return Promise.resolve();
    return flush().then(function () { state.sync = "ok"; }).catch(handleSyncErr).then(function () { if (!state.draft && !state.scan) render(); });
  }
  function saveVale(v) {
    var clean = cleanVale(v);
    if (!clean) { toast("Revisa el saldo y la fecha"); return false; }
    state.vale = clean; state.valeEdit = false; state.valeSynced = true;
    persistVale(clean);
    if (state.code) api("set_settings", { settings: clean }).catch(function () {});
    return true;
  }

  // ---------- Lectura del recibo (vía /api/scan) ----------
  function compress(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, 2000 / Math.max(w, h));
        var c = document.createElement("canvas"); c.width = Math.round(w * sc); c.height = Math.round(h * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        var q = 0.85, out = c.toDataURL("image/jpeg", q);
        while (out.length > 1300000 && q > 0.4) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
        resolve(out);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("img")); };
      img.src = url;
    });
  }

  var CLAUDE_PROMPT = 'Lee este recibo de supermercado (moneda: dólares/balboas) y responde SOLO con un JSON, sin texto adicional ni backticks, con esta forma: {"tienda":"nombre del comercio","fecha":"YYYY-MM-DD o cadena vacía si no se ve","total":número con el total pagado,"items":[{"nombre":"nombre legible del producto","producto":"nombre genérico corto para agrupar, ej. Leche, Arroz, Pollo","cantidad":número,"unidad":"kg, lb, unidad, paquete, etc. según cómo se cobró la línea","monto":número con el total final de esa línea (incluye su parte del impuesto si aplica, no lo separes),"categoria":"una de: ' + CATS.join(" | ") + '"}]}. Resta del monto los descuentos de cada línea. No incluyas subtotales, impuestos por separado, cambio, propinas ni puntos de fidelidad como ítems.';
  function fromScan(data) {
    var raw = Array.isArray(data) ? { items: data } : (data || {});
    var items = (Array.isArray(raw.items) ? raw.items : []).map(function (x) {
      return {
        name: String(x.nombre != null ? x.nombre : (x.name || "")).trim(),
        generic: String(x.producto || "").trim(),
        unit: String(x.unidad || "").trim(),
        qty: num(x.cantidad, 1),
        amount: r2(num(x.monto, 0)),
        category: CATS.indexOf(x.categoria) >= 0 ? x.categoria : "Otros"
      };
    }).filter(function (it) { return it.name || it.amount; });
    var tot = num(raw.total, NaN);
    return { id: null, store: String(raw.tienda || "").trim(), date: isDate(raw.fecha) ? raw.fecha : todayStr(), receiptTotal: isNaN(tot) ? null : tot, items: items, payment: "", source: "foto", returnTab: "resumen" };
  }

  function errCopy(e) {
    var code = e && e.code;
    if (code === "code") return "El código de acceso es incorrecto. Vuelve a ingresarlo.";
    if (code === "config") return "Falta configurar GEMINI_API_KEY (o ANTHROPIC_API_KEY) y APP_CODE en Vercel.";
    if (code === "busy") return "Se alcanzó el límite del servicio (en el plan gratis es por minuto y por día)." + (e.detail ? " Detalle: " + e.detail : "") + " Intenta más tarde o ingresa la compra manualmente.";
    if (code === "size") return "Las fotos pesan demasiado. Prueba con menos fotos o más cerca del recibo.";
    if (code === "parse") return "No logré leer el recibo. Prueba con una foto más nítida y completa.";
    if (code === "upstream") return "Error del servicio de lectura" + (e.detail ? ": " + e.detail : ".");
    if (e && e.message === "img") return "No pude abrir esa imagen. Prueba con otra foto.";
    return "No se pudo leer el recibo. Revisa tu conexión e intenta de nuevo.";
  }

  function startScan(fileList) {
    var files = Array.prototype.slice.call(fileList || [], 0, 3);
    if (!files.length || !state.code) return;
    var ctl = new AbortController();
    state.scan = { ctl: ctl }; state.scanError = ""; state.tab = "escanear"; render();
    Promise.all(files.map(compress)).then(function (images) {
      return fetch("/api/scan", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ images: images, code: state.code }), signal: ctl.signal });
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var er = new Error(j.error || "http"); er.code = j.error; er.detail = j.detail; er.status = r.status; throw er; }
        return j;
      });
    }).then(function (data) {
      state.scan = null;
      var d = fromScan(data);
      if (!d.items.length) { state.scanError = "No encontré productos en la foto. Prueba con una imagen más clara o ingresa la compra manualmente."; render(); return; }
      state.draft = d; render(); window.scrollTo(0, 0);

  // ---------- Análisis ----------
  function inPeriod(p) {
    if (state.period === "todo") return true;
    if (state.period === "corte") { var c = corteRange(new Date()); return p.date >= c.start && p.date <= c.end; }
    var d = new Date(p.date + "T00:00:00"), now = new Date();
    if (state.period === "mes") return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    var days = state.period === "30" ? 30 : 90;
    return (now - d) / 86400000 <= days;
  }
  function sumItems(items) { return r2(items.reduce(function (s, it) { return s + (Number(it.amount) || 0); }, 0)); }
  function purchaseTotal(p) { return sumItems(p.items); }

  function analyze() {
    var ps = state.purchases.filter(inPeriod), all = [];
    ps.forEach(function (p) { p.items.forEach(function (it) { all.push({ pid: p.id, payment: p.payment, name: it.name, generic: it.generic, unit: it.unit, qty: it.qty, amount: Number(it.amount) || 0, category: it.category, store: p.store, date: p.date }); }); });
    var total = r2(all.reduce(function (s, i) { return s + i.amount; }, 0));
    var byCat = {}, byStore = {};
    all.forEach(function (i) { byCat[i.category] = (byCat[i.category] || 0) + i.amount; });
    ps.forEach(function (p) { byStore[p.store] = (byStore[p.store] || 0) + purchaseTotal(p); });
    var byPay = {};
    ps.forEach(function (p) {
      var k = p.payment || "Sin especificar", t = purchaseTotal(p);
      if (!byPay[k]) byPay[k] = { sum: 0, buys: [] };
      byPay[k].sum += t; byPay[k].buys.push({ id: p.id, date: p.date, store: p.store, count: p.items.length, sum: t });
    });
    var pays = Object.keys(byPay).map(function (k) {
      return { name: k, sum: r2(byPay[k].sum), buys: byPay[k].buys.sort(function (a, b) { return b.date.localeCompare(a.date); }) };
    }).sort(function (a, b) { return b.sum - a.sum; });
    var cats = Object.keys(byCat).map(function (c) { return { name: c, sum: r2(byCat[c]) }; }).sort(function (a, b) { return b.sum - a.sum; });
    var stores = Object.keys(byStore).map(function (s) { return { name: s, sum: r2(byStore[s]) }; }).sort(function (a, b) { return b.sum - a.sum; });
    var scoped = state.cat ? all.filter(function (i) { return i.category === state.cat; }) : all;
    var g = {};
    scoped.forEach(function (i) {
      var label = (i.generic || i.name || "Sin nombre").trim(), k = pkey(label);
      if (!g[k]) g[k] = { key: k, name: label, labels: {}, sum: 0, times: 0, category: i.category, buys: {} };
      g[k].labels[label] = (g[k].labels[label] || 0) + 1;
      g[k].sum += i.amount; g[k].times += 1;
      var b = g[k].buys[i.pid] || (g[k].buys[i.pid] = { id: i.pid, date: i.date, store: i.store, payment: i.payment, sum: 0, qty: 0, unit: i.unit, names: {} });
      b.sum += i.amount; b.qty += i.qty;
      var itemName = (i.name || i.generic || "Sin nombre").trim();
      b.names[itemName] = (b.names[itemName] || 0) + 1;
    });
    var prods = Object.keys(g).map(function (k) {
      var x = g[k]; x.sum = r2(x.sum);
      x.name = Object.keys(x.labels).sort(function (a, b) { return a.length - b.length || x.labels[b] - x.labels[a]; })[0];
      x.buys = Object.keys(x.buys).map(function (id) { var b = x.buys[id]; b.sum = r2(b.sum); b.unitTxt = b.qty ? unitPriceText(b.qty, b.sum, b.unit) : ""; b.nameTxt = Object.keys(b.names).join(", "); return b; }).sort(function (a, b) { return b.date.localeCompare(a.date); });
      return x;
    }).sort(function (a, b) { return b.sum - a.sum; }).slice(0, 12);
    return { ps: ps, total: total, cats: cats, stores: stores, pays: pays, prods: prods };
  }

  function monthly() {
    var now = new Date(), out = [], map = {};
    state.purchases.forEach(function (p) { var k = p.date.slice(0, 7); map[k] = (map[k] || 0) + purchaseTotal(p); });

    }
    return out;
  }

      return '<div class="card empty"><div class="big">🏷️</div><h2>Aún no hay precios que comparar</h2><p class="sub">Cuando agregues compras, aquí verás el precio unitario de cada producto a lo largo del tiempo.</p></div>';
    }
    var q = norm(state.priceQuery);
    var stats = allStats().filter(function (x) { return !q || norm(x.name).indexOf(q) >= 0; });
    var html = '<div class="card"><h2>Comparar precios</h2><p class="sub">Precio por unidad (o por kg/lb) de cada producto, compra por compra.</p>' +
      '<input class="search" id="pq" value="' + esc(state.priceQuery) + '" placeholder="Buscar producto…" aria-label="Buscar producto"></div>';
    if (!stats.length) return html + '<div class="card"><p class="sub" style="margin:0">No encontré productos con ese nombre.</p></div>';
    var byCat = {};
    stats.forEach(function (x) { (byCat[x.category] = byCat[x.category] || []).push(x); });
    var cmp = function (a, b) { return a.localeCompare(b, "es", { sensitivity: "base" }); };
    Object.keys(byCat).sort(cmp).forEach(function (cat) {
      var list = byCat[cat].sort(function (a, b) { return cmp(a.name, b.name); });
      var collapsed = !q && state.pcols[cat];
      html += '<div class="card"><button class="cathead" data-act="pcat" data-k="' + esc(cat) + '" aria-expanded="' + !collapsed + '"><span class="chev"></span><b>' + esc(cat) + '</b><span class="small">' + list.length + '</span></button>';
      if (!collapsed) html += '<div class="tiles">' + list.map(function (x) {
        return '<button class="tile" data-act="pcmp" data-k="' + esc(x.key) + '" aria-pressed="' + (state.pcmp === x.key) + '">' + timgHtml(x.art) + '<span class="tname">' + esc(x.name) + '</span></button>';
      }).join("") + '</div>';
      html += '</div>';
    });
    var sel = state.pcmp ? allStats().filter(function (x) { return x.key === state.pcmp; })[0] : null;
    if (sel) {
      html += '<div class="sheetwrap" data-act="pclose"><div class="sheet" data-act="noop" role="dialog" aria-label="' + esc(sel.name) + '"><div class="sheethead">' + timgHtml(sel.art) + '<h2>' + esc(sel.name) + '</h2><button class="icon" data-act="pclose" aria-label="Cerrar" style="width:44px">✕</button></div>' +
        '<p class="small" style="margin:0 0 10px">' + sel.count + (sel.count === 1 ? ' compra' : ' compras') + (sel.count > 1 ? ' · desde ' + money(sel.min) + ' hasta ' + money(sel.max) : '') + '</p>' +
        sel.occ.map(function (o) {
          var cls = sel.count > 1 ? (o.price === sel.min ? " best" : (o.price === sel.max ? " worst" : "")) : "";
          return '<button class="pricebox' + cls + '" data-act="open" data-rt="precios" data-id="' + esc(o.pid) + '" data-idx="' + o.idx + '"><div class="up"><span>' + esc(o.name || sel.name) + ' · ' + fdateShort(o.date) + ' · ' + esc(o.store) + '</span><b>' + money(o.price) + ' x ' + esc(o.unit || "unidad") + (o.perKgTxt ? ' <span class="small">(' + esc(o.perKgTxt) + ')</span>' : '') + '</b></div>' +
            '<div class="small">' + o.qty + ' ' + esc(o.unit || "unidad") + (o.qty !== 1 ? "s" : "") + ' · total ' + money(o.amount) + (o.payment ? ' · ' + esc(o.payment) : '') + '</div></button>';
        }).join("") + '</div></div>';
    }
    return html;
  }

  function render() {
    document.querySelectorAll(".nav button").forEach(function (b) { b.setAttribute("aria-current", b.dataset.tab === state.tab ? "page" : "false"); });
    var html;
    if (state.draft) html = viewDraft();
    else if (state.tab === "escanear") html = viewEscanear();
    else if (state.tab === "historial") html = viewHistorial();
    else if (state.tab === "precios") html = viewPrecios();
    else html = viewResumen();
    $("#main").innerHTML = html;
    if (state.draft) updateTotals();
    var onPrecios = state.tab === "precios" && !state.draft;
    document.body.style.overflow = onPrecios && state.pcmp ? "hidden" : "";
  }

  // ---------- Acciones ----------
  function toCSV() {
    var rows = [["fecha","tienda","metodo_pago","producto","articulo","cantidad","categoria","monto"]];
    state.purchases.slice().sort(function (a, b) { return a.date.localeCompare(b.date); }).forEach(function (p) {
      p.items.forEach(function (it) { rows.push([p.date, p.store, p.payment || "", it.generic || it.name, it.name, it.qty, it.category, Number(it.amount).toFixed(2)]); });
    });
    return "\ufeff" + rows.map(function (r) { return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(","); }).join("\n");
  }
  function saveFile(name, data, type) {
    var url = URL.createObjectURL(new Blob([data], { type: type })), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }

  function saveDraft() {
    var d = state.draft;
    var items = d.items.filter(function (it) { return String(it.name).trim() || Number(it.amount); }).map(function (it) {
      var sq = Number(it.sizeQty); return { name: String(it.name).trim() || "Sin nombre", generic: String(it.generic || "").trim(), unit: String(it.unit || "").trim(), sizeQty: sq > 0 ? sq : "", sizeUnit: SIZE_UNITS.indexOf(it.sizeUnit) >= 0 ? it.sizeUnit : "", qty: Number(it.qty) || 1, amount: r2(Number(it.amount) || 0), category: CATS.indexOf(it.category) >= 0 ? it.category : "Otros" };
    });
    if (!items.length) { toast("Agrega al menos un ítem"); return; }
    if (!d.id && !d.payment) { toast("Elige el método de pago"); return; }
    var isNew = !d.id;
    var rec = { id: d.id || uid(), store: String(d.store).trim() || "Sin tienda", date: isDate(d.date) ? d.date : todayStr(), payment: d.payment || "", items: items, source: d.source };
    var idx = state.purchases.findIndex(function (p) { return p.id === rec.id; });
    if (idx >= 0) state.purchases[idx] = rec; else state.purchases.push(rec);
    persist(); pushSave(rec.id); notifyUpdate(rec, isNew);
    state.tab = d.returnTab || "resumen"; state.draft = null;
    render(); window.scrollTo(0, 0);
    toast("Compra guardada" + (rec.payment === "VALE" && state.vale ? " · Saldo VALE: " + money(valeBalanceAsOf(todayStr())) : ""));
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act],[data-tab]"); if (!t) return;
    var act = t.dataset.act;
    if (!act && t.dataset.tab) { state.tab = t.dataset.tab; state.draft = null; state.confirmWipe = false; state.scanError = ""; state.editCode = false; state.pasting = false; state.pcmp = null; render(); window.scrollTo(0, 0); return; }
    switch (act) {
      case "tab": state.tab = t.dataset.tab; render(); window.scrollTo(0, 0); break;
      case "period": state.period = t.dataset.p; state.prod = null; state.pay = null; render(); break;
      case "pay": state.pay = state.pay === t.dataset.k ? null : t.dataset.k; render(); break;
      case "pcmp": state.pcmp = t.dataset.k; render(); break;
      case "pclose": state.pcmp = null; render(); break;
      case "noop": break;
      case "pcat": state.pcols[t.dataset.k] = !state.pcols[t.dataset.k]; try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(state.pcols)); } catch (er) {} render(); break;
      case "cat": state.cat = state.cat === t.dataset.cat ? null : t.dataset.cat; state.prod = null; render(); break;
      case "prod": state.prod = state.prod === t.dataset.k ? null : t.dataset.k; render(); break;
      case "clear-cat": state.cat = null; state.prod = null; render(); break;
      case "cam": $("#cam").click(); break;
      case "gal": $("#gal").click(); break;
      case "cancel-scan": if (state.scan) state.scan.ctl.abort(); break;
      case "save-code":
        var v = ($("#codein") || {}).value || "";
        if (!v.trim()) { toast("Escribe el código"); break; }
        state.code = v.trim(); setCode(state.code); state.editCode = false; state.scanError = ""; state.sync = "off"; render(); syncNow(); break;
      case "edit-code": state.editCode = true; render(); break;
      case "vale-edit": state.valeEdit = true; render(); break;
      case "vale-cancel": state.valeEdit = false; render(); break;
      case "vale-save":
        if (saveVale({ anchorDate: ($("#v_date") || {}).value, anchorBalance: ($("#v_bal") || {}).value, rechargeAmount: ($("#v_amt") || {}).value, rechargeDay: ($("#v_day") || {}).value })) render();
        break;
      case "paste": state.pasting = true; render(); break;
      case "paste-cancel": state.pasting = false; render(); break;
      case "copy-prompt":
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(CLAUDE_PROMPT).then(function () { toast("Copiado"); }).catch(function () { toast("No se pudo copiar; selecciona el texto a mano"); });
        else toast("No se pudo copiar; selecciona el texto a mano");
        break;
      case "paste-go":
        var txt = ($("#pj") || {}).value || "", a0 = txt.search(/[\{\[]/), a1 = Math.max(txt.lastIndexOf("}"), txt.lastIndexOf("]"));
        try {
          var dd = fromScan(JSON.parse(txt.slice(a0, a1 + 1)));
          if (!dd.items.length) throw new Error("empty");
          state.pasting = false; state.draft = dd; render(); window.scrollTo(0, 0);
        } catch (er) { toast("No pude leer ese texto. Pega el JSON completo que te dio Claude."); }
        break;
      case "manual": state.draft = { id: null, store: "", date: todayStr(), receiptTotal: null, items: [{ name: "", generic: "", unit: "", sizeQty: "", sizeUnit: "", qty: 1, amount: 0, category: "Otros" }], payment: "", source: "manual", returnTab: "resumen" }; render(); window.scrollTo(0, 0); break;
      case "add-item": state.draft.items.push({ name: "", generic: "", unit: "", sizeQty: "", sizeUnit: "", qty: 1, amount: 0, category: "Otros" }); render(); break;
      case "del-item": var row = t.closest(".item"); state.draft.items.splice(+row.dataset.i, 1); render(); break;
      case "cancel": state.draft = null; render(); break;
      case "save": saveDraft(); break;
      case "delete":
        if (!state.draft.confirmDel) { state.draft.confirmDel = true; render(); break; }
        var delId = state.draft.id;
        state.purchases = state.purchases.filter(function (p) { return p.id !== delId; });
        persist(); pushDelete(delId); state.draft = null; render(); toast("Compra borrada"); break;
      case "open": openPurchase(t.dataset.id, t.dataset.rt || "historial", t.dataset.idx !== undefined ? Number(t.dataset.idx) : null); break;
      case "csv": saveFile("gastos-supermercado.csv", toCSV(), "text/csv;charset=utf-8"); break;
      case "backup": saveFile("mi-super-respaldo.json", JSON.stringify(state.purchases), "application/json"); break;
      case "restore": $("#restore").click(); break;
      case "wipe":
        if (!state.confirmWipe) { state.confirmWipe = true; render(); break; }
        var doWipe = function () { state.purchases = []; state.confirmWipe = false; persist(); setPend({ s: [], d: [] }); render(); toast("Datos borrados"); };
        if (state.code && state.sync !== "nostore") {
          api("wipe").then(doWipe).catch(function (er) { if (er && er.code === "nostore") doWipe(); else toast("No se pudo borrar en el servidor. Intenta de nuevo."); });
        } else doWipe();
        break;
    }
  });

  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "pq") { state.priceQuery = t.value; render(); var el = $("#pq"); if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; } return; }
    var d = state.draft; if (!d || !$("#main").contains(t)) return;
    if (t.dataset.f) { d[t.dataset.f] = t.value; return; }
    var row = t.closest(".item"), k = t.dataset.k; if (!row || !k) return;
    var it = d.items[+row.dataset.i], v = t.value;
    if (k === "qty" || k === "amount") v = num(v, 0);
    it[k] = v;
    if (k === "amount") updateTotals();
    if (k === "qty" || k === "amount" || k === "unit" || k === "sizeQty" || k === "sizeUnit") { var up = row.querySelector("[data-up]"); if (up) up.textContent = unitPriceText(it.qty, it.amount, it.unit, it.sizeQty, it.sizeUnit); }
  });

  $("#cam").addEventListener("change", function (e) { startScan(e.target.files); e.target.value = ""; });
  $("#gal").addEventListener("change", function (e) { startScan(e.target.files); e.target.value = ""; });
  $("#restore").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var arr = JSON.parse(rd.result);
        if (!Array.isArray(arr)) throw new Error("bad");
        var ok = arr.filter(function (p) { return p && p.id && isDate(p.date) && Array.isArray(p.items); });
        var ids = {}; state.purchases.forEach(function (p) { ids[p.id] = true; });
        var added = 0, pd = getPend(); ok.forEach(function (p) { if (!ids[p.id]) { state.purchases.push(p); pd.s.push(p.id); added++; } });
        setPend(pd); persist(); render(); toast(added + " compras restauradas"); trySync();
      } catch (err) { toast("El archivo no es un respaldo válido"); }
    };
    rd.readAsText(f);
  });

  state.pcols = loadCollapsed();
  render();
  if (state.code) syncNow();
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && state.code) syncNow(); });
})();
</script>
</body>
</html>
