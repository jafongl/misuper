<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Súper</title>
<meta name="theme-color" content="#1f7a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Súper">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<style>
:root {
  --bg:#f6f5f1; --surface:#ffffff; --text:#1c1b18; --muted:#6b6a63; --line:#e5e3db;
  --accent:#1f7a4d; --accent-ink:#ffffff; --accent-soft:#e3f1ea;
  --danger:#b3261e; --warn:#7a5200; --warn-bg:#fff1cc;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#141412; --surface:#1e1e1b; --text:#efeee8; --muted:#9c9b92; --line:#33332e;
    --accent:#4cc58a; --accent-ink:#0b1f15; --accent-soft:#1c2e25;
    --danger:#ff8a80; --warn:#f3c969; --warn-bg:#3a2f12;
  }
}
:root[data-theme="dark"] {
  --bg:#141412; --surface:#1e1e1b; --text:#efeee8; --muted:#9c9b92; --line:#33332e;
  --accent:#4cc58a; --accent-ink:#0b1f15; --accent-soft:#1c2e25;
  --danger:#ff8a80; --warn:#f3c969; --warn-bg:#3a2f12;
}
html { scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%; }
.wrap { max-width:720px; margin:0 auto; padding:18px 16px 120px; }
h1 { font-size:22px; margin:0 0 2px; letter-spacing:-.01em; }
h2 { font-size:17px; margin:0 0 12px; }
h3 { font-size:14px; margin:0 0 10px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
button { font:inherit; color:inherit; cursor:pointer; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:12px; padding:12px 16px; font-weight:600; background:var(--accent); color:var(--accent-ink); min-height:46px; }
.btn.big { width:100%; padding:18px; font-size:17px; }
.btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
.btn.danger { background:transparent; color:var(--danger); border:1px solid var(--danger); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.stack { display:flex; flex-direction:column; gap:10px; }
.row { display:flex; gap:10px; }
.row > * { flex:1; min-width:0; }
label { display:block; font-size:13px; color:var(--muted); }
input, select, textarea { width:100%; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-height:44px; margin-top:4px; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; }
.chip { flex:none; border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:8px 14px; font-size:14px; }
.chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
.kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
.kpi { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; }
.kpi b { display:block; font-size:19px; letter-spacing:-.01em; }
.kpi span { font-size:12px; color:var(--muted); }
.insight { background:var(--accent-soft); border-radius:14px; padding:12px 14px; margin-bottom:12px; font-size:15px; }
.bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:6px; }
.bar > i { display:block; height:100%; border-radius:99px; }
.line { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
.line .n { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.line .v { font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
.small { font-size:12px; color:var(--muted); }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }
.catrow { display:block; width:100%; text-align:left; background:none; border:0; padding:8px 0; border-bottom:1px solid var(--line); }
.catrow:last-child { border-bottom:0; }
.catrow[aria-pressed="true"] { background:var(--accent-soft); border-radius:10px; padding-left:8px; padding-right:8px; }
.prod { padding:8px 0; border-bottom:1px solid var(--line); }
.prod:last-child { border-bottom:0; }
.trend { display:flex; align-items:flex-end; gap:8px; height:110px; }
.trend > div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
.trend i { display:block; width:100%; max-width:38px; background:var(--accent); border-radius:6px 6px 0 0; min-height:2px; }
.trend span { font-size:11px; color:var(--muted); margin-top:4px; }
.hist { display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px; }
.item { border-top:1px solid var(--line); padding:10px 0; transition:background-color .3s; border-radius:10px; }
.item.focus { background:var(--accent-soft); }
.item:first-child { border-top:0; }
textarea { min-height:140px; resize:vertical; font-size:13px; }
.pbtn { display:block; width:100%; text-align:left; background:none; border:0; padding:0; }
.cathead { display:flex; align-items:center; gap:10px; width:100%; background:none; border:0; padding:4px 0; text-align:left; }
.cathead b { font-size:16px; flex:1; }
.chev { width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(-45deg); transition:transform .15s; flex:none; margin:0 4px 0 2px; }
.cathead[aria-expanded="true"] .chev { transform:rotate(45deg); }
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:14px 12px; margin-top:12px; }
.tile { display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:0; padding:0; text-align:center; min-width:0; }
.timg { display:flex; align-items:center; justify-content:center; width:100%; aspect-ratio:1/1; border-radius:14px; background:#f4f2ec; overflow:hidden; }
.timg svg { width:86%; height:86%; display:block; }
.tname { font-size:13px; line-height:1.2; max-width:100%; overflow-wrap:anywhere; }
.tile[aria-pressed="true"] .timg { outline:2px solid var(--accent); outline-offset:2px; }
.sheetwrap { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:var(--surface); width:100%; max-width:720px; max-height:84vh; overflow:auto; border-radius:18px 18px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px)); }
.sheethead { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.sheethead .timg { width:60px; flex:none; border-radius:12px; }
.sheethead h2 { margin:0; flex:1; min-width:0; overflow-wrap:anywhere; }
.pbtn[aria-pressed="true"] .n { color:var(--accent); font-weight:700; }
.buys { margin:8px 0 2px; }
.buy { display:flex; justify-content:space-between; gap:10px; width:100%; text-align:left; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px; font-size:14px; }
.buy b { font-variant-numeric:tabular-nums; white-space:nowrap; }
.unitline { font-size:12px; color:var(--muted); margin-top:2px; }
.pricebox { display:block; width:100%; text-align:left; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:6px; -webkit-appearance:none; appearance:none; }
.pricebox .up { display:flex; justify-content:space-between; gap:10px; font-size:14px; }
.pricebox .up b { font-variant-numeric:tabular-nums; white-space:nowrap; }
.pricebox.best b { color:var(--accent); }
.pricebox.worst b { color:var(--danger); }
.search { width:100%; }
.item .r2 { display:grid; grid-template-columns:64px 92px 1fr 44px; gap:8px; margin-top:6px; }
.item .r2 input, .item .r2 select { margin-top:0; }
.item .gen { margin-top:6px; }
.item .gen input { min-height:38px; font-size:14px; }
.icon { border:1px solid var(--line); background:transparent; border-radius:10px; min-height:44px; color:var(--muted); }
.totalbar { display:flex; justify-content:space-between; align-items:center; font-size:18px; padding:12px 0 4px; }
.warn { background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:10px 12px; font-size:14px; margin:8px 0; }
.warn:empty { display:none; }
.err { background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:12px 14px; margin-bottom:12px; font-size:14px; }
.spin { width:38px; height:38px; border-radius:50%; border:4px solid var(--line); border-top-color:var(--accent); animation:sp 0.9s linear infinite; margin:8px auto 14px; }
@keyframes sp { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration:3s; } }
.center { text-align:center; }
.nav { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; gap:4px; background:var(--surface); border-top:1px solid var(--line); padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px)); }
.nav button { flex:1; background:none; border:0; border-radius:12px; padding:8px 4px; font-size:12px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; }
.nav button span { font-size:20px; line-height:1; }
.nav button[aria-current="page"] { color:var(--accent); font-weight:700; background:var(--accent-soft); }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(86px + env(safe-area-inset-bottom,0px)); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:99px; font-size:14px; z-index:9; max-width:90%; }
.toast:empty { display:none; }
.toast.warn { background:var(--warn-bg); color:var(--warn); }
.toast.err { background:var(--danger); color:#fff; }
.empty { text-align:center; padding:28px 12px; }
.empty .big { font-size:44px; }
.toprow { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
.toprow h1 { margin:0 0 2px; }
.toprow .sub { margin:0; }
.sync-pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:6px 10px; border-radius:99px; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; white-space:nowrap; }
.sync-pill.ok { background:var(--accent-soft); color:var(--accent); border-color:transparent; }
.sync-pill.warn { background:var(--warn-bg); color:var(--warn); border-color:transparent; }
.sync-pill.err { background:rgba(179,38,30,.12); color:var(--danger); border-color:transparent; }
.sync-pill .dot2 { width:6px; height:6px; border-radius:50%; background:currentColor; }
.welcome { background:linear-gradient(135deg, var(--accent-soft), var(--surface)); }
.welcome h2 { margin-bottom:6px; }
.searchwrap { position:relative; margin-bottom:10px; }
.searchwrap input { padding-left:36px; }
.searchwrap::before { content:"🔍"; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; opacity:.55; pointer-events:none; }
.filterrow { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; }
.spark { display:flex; align-items:flex-end; gap:3px; height:44px; margin:6px 0 4px; }
.spark > i { flex:1; min-height:2px; background:var(--accent); border-radius:3px 3px 0 0; opacity:.35; }
.spark > i:last-child { opacity:1; }
.spark > i.best { background:#2e9d5a; opacity:.9; }
.spark > i.worst { background:var(--danger); opacity:.7; }
.compare { font-size:14px; margin:8px 0 0; }
.compare .up { color:var(--danger); font-weight:600; }
.compare .down { color:var(--accent); font-weight:600; }
.dline { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-top:4px; }
.dline .amt { font-weight:600; color:var(--accent); font-variant-numeric:tabular-nums; font-size:14px; }
.dline .u { font-size:12px; color:var(--muted); }
.vbadge { font-size:11px; font-weight:700; padding:3px 8px; border-radius:99px; background:var(--warn-bg); color:var(--warn); }
.vbadge.bad { background:rgba(179,38,30,.12); color:var(--danger); }
.vbadge.ok { background:var(--accent-soft); color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="toprow">
    <div>
      <h1>🛒 Mi Súper</h1>
      <p class="sub">Tus gastos del supermercado, ítem por ítem.</p>
    </div>
    <button class="sync-pill" id="syncpill" data-act="sync-status" aria-label="Estado de sincronización"></button>
  </div>
  <main id="main"></main>
</div>

<nav class="nav" aria-label="Secciones">
  <button data-tab="resumen"><span>📊</span>Resumen</button>
  <button data-tab="escanear"><span>📷</span>Agregar</button>
  <button data-tab="historial"><span>🧾</span>Historial</button>
  <button data-tab="precios"><span>🏷️</span>Precios</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" multiple hidden>
<input type="file" id="restore" accept="application/json,.json" hidden>

<script>
(function () {
  "use strict";

  var CATS = ["Frutas y verduras","Carnes y pescados","Lácteos y huevos","Panadería","Despensa","Bebidas","Snacks y dulces","Congelados","Limpieza del hogar","Cuidado personal","Mascotas","Otros"];
  var COLORS = ["#3f9c5a","#c8553d","#e0a526","#b98a5c","#8b6bb8","#3b8fd0","#e0709a","#5bb5c9","#6f8f3d","#d98b3a","#8a7a6a","#a0a0a0"];
  var PAYMENTS = ["VISA Jose","VISA Irina","Efectivo","VALE"];
  var KEY = "misuper:v1", CODE_KEY = "misuper:code";

  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function num(v, d) {
    if (typeof v === "number") return isNaN(v) ? d : v;
    var s = String(v == null ? "" : v).trim();
    if (!s) return d;
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, "");
    else if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(",", ".");
    var n = parseFloat(s);
    return isNaN(n) ? d : n;
  }
  function r2(n) { return Math.round(n * 100) / 100; }
  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function isDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || "")); }
  function money(n) { n = Number(n) || 0; var s = Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (n < 0 ? "-" : "") + "$" + s; }
  function fdate(s) { var d = new Date(s + "T00:00:00"); return isNaN(d) ? s : d.toLocaleDateString("es", { day: "numeric", month: "short", year: "numeric" }); }
  function fdateShort(s) {
    var d = new Date(s + "T00:00:00"); if (isNaN(d)) return s;
    return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getFullYear() % 100).padStart(2, "0");
  }
  function norm(s) { return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase(); }
  function stem(w) {
    if (w.length > 4 && /[nlrzdj]es$/.test(w)) return w.slice(0, -2);
    if (w.length > 3 && w.charAt(w.length - 1) === "s") return w.slice(0, -1);
    return w;
  }
  function pkey(label) { return norm(label).split(/\s+/).map(stem).join(" "); }
  function catColor(c) { var i = CATS.indexOf(c); return COLORS[i < 0 ? CATS.length - 1 : i]; }
  function fdateDM(s) { var d = new Date(s + "T00:00:00"); return isNaN(d) ? s : d.toLocaleDateString("es", { day: "numeric", month: "short" }); }

  function corteRange(ref) {
    var d = ref || new Date(), y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
    if (day < 15) { m -= 1; if (m < 0) { m = 11; y -= 1; } }
    var start = new Date(y, m, 15), end = new Date(y, m + 1, 14);
    function f(dt) { return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0"); }
    return { start: f(start), end: f(end) };
  }

  var VALE_KEY = "misuper:vale";
  function loadVale() {
    try { var v = JSON.parse(localStorage.getItem(VALE_KEY)); return (v && v.anchorDate) ? v : null; } catch (e) { return null; }
  }
  function persistVale(v) { try { localStorage.setItem(VALE_KEY, JSON.stringify(v)); } catch (e) {} }
  function cleanVale(v) {
    v = v || {};
    var ab = Number(v.anchorBalance), ra = Number(v.rechargeAmount), rd = parseInt(v.rechargeDay, 10);
    if (!isDate(v.anchorDate) || !isFinite(ab)) return null;
    return {
      anchorDate: v.anchorDate,
      anchorBalance: r2(ab),
      rechargeAmount: isFinite(ra) && ra > 0 ? r2(ra) : 0,
      rechargeDay: (rd >= 1 && rd <= 28) ? rd : 18
    };
  }
  function countRecharges(fromExclusive, toInclusive, day) {
    var from = new Date(fromExclusive + "T00:00:00"), to = new Date(toInclusive + "T00:00:00");
    var d = new Date(from.getFullYear(), from.getMonth(), day);
    if (d <= from) d = new Date(d.getFullYear(), d.getMonth() + 1, day);
    var n = 0;
    while (d <= to) { n++; d = new Date(d.getFullYear(), d.getMonth() + 1, day); }
    return n;
  }
  function valeBalanceAsOf(dateStr) {
    var v = state.vale; if (!v) return null;
    var recharged = countRecharges(v.anchorDate, dateStr, v.rechargeDay) * v.rechargeAmount;
    var spent = 0;
    state.purchases.forEach(function (p) { if (p.payment === "VALE" && p.date >= v.anchorDate && p.date <= dateStr) spent += purchaseTotal(p); });
    return r2(v.anchorBalance + recharged - spent);
  }
  function nextRechargeDate(dateStr) {
    var v = state.vale; if (!v) return null;
    var d = new Date(dateStr + "T00:00:00"), r = new Date(d.getFullYear(), d.getMonth(), v.rechargeDay);
    if (r <= d) r = new Date(r.getFullYear(), r.getMonth() + 1, v.rechargeDay);
    return r.getFullYear() + "-" + String(r.getMonth() + 1).padStart(2, "0") + "-" + String(r.getDate()).padStart(2, "0");
  }

  function load() { try { var r = localStorage.getItem(KEY); var a = r ? JSON.parse(r) : []; return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function getCode() { try { return localStorage.getItem(CODE_KEY) || ""; } catch (e) { return ""; } }
  function setCode(c) { try { if (c) localStorage.setItem(CODE_KEY, c); else localStorage.removeItem(CODE_KEY); } catch (e) {} }
  var toastTimer;
  function toast(msg, kind) {
    var t = $("#toast");
    t.textContent = msg;
    t.className = "toast" + (kind ? " " + kind : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.textContent = ""; t.className = "toast"; }, 2800);
  }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state.purchases)); } catch (e) { toast("No se pudo guardar en este navegador", "err"); } }

  var SYNC_KEY = "misuper:synced", PEND_KEY = "misuper:pending";
  function isSynced() { try { return !!localStorage.getItem(SYNC_KEY); } catch (e) { return false; } }
  function markSynced() { try { localStorage.setItem(SYNC_KEY, "1"); } catch (e) {} }
  function getPend() { try { var p = JSON.parse(localStorage.getItem(PEND_KEY)); return { s: (p && p.s) || [], d: (p && p.d) || [] }; } catch (e) { return { s: [], d: [] }; } }
  function setPend(p) { try { localStorage.setItem(PEND_KEY, JSON.stringify(p)); } catch (e) {} }
  function validPurchase(p) { return p && p.id && isDate(p.date) && Array.isArray(p.items); }
  function chunk(arr, n) { var out = []; for (var i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; }

  var state = {
    tab: "resumen", period: "mes", cat: null, prod: null, pay: null,
    priceQuery: "", pcmp: null, pcols: {},
    purchases: load(), draft: null, scan: null, scanError: "",
    confirmWipe: false, code: getCode(), editCode: false, pasting: false,
    sync: "off", syncing: false, vale: loadVale(), valeEdit: false, valeSynced: false,
    historyQuery: "", historyPay: null
  };

  function api(op, payload) {

  function inPeriod(p) {

    var d = new Date(p.date + "T00:00:00"), now = new Date();
    if (state.period === "mes") return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();

  function previousPeriodTotal() {
    if (state.period === "todo") return null;
    var c = corteRange(new Date());
    var ps = state.purchases.filter(function (p) {
      if (state.period === "corte") {

  function analyze() {

  var SIZE_UNITS = ["g", "kg", "ml", "L", "lb", "oz", "unidad"];
  var SIZE_FACTORS = { g: { kind: "kg", f: 1 / 1000 }, kg: { kind: "kg", f: 1 }, lb: { kind: "kg", f: 0.45359237 }, oz: { kind: "kg", f: 0.028349523125 }, ml: { kind: "L", f: 1 / 1000 }, L: { kind: "L", f: 1 }, unidad: { kind: "unidad", f: 1 } };
  function isWeightOrVolumeUnit(u) {
    return /^(kg|kilo|kilos|kilogramo|kilogramos|g|gr|grs|gramo|gramos|lb|lbs|libra|libras|oz|onza|onzas|l|lt|litro|litros|ml|mililitro|mililitros)$/.test(norm(u));
  }
  function isCountUnit(u) {
    return /^(unidad|unidades|unid|und|u|pieza|piezas|pz|pza)$/.test(norm(u));
  }
  function perKgText(pricePerItem, sizeQty, sizeUnit, basisUnit) {
    var def = SIZE_FACTORS[sizeUnit];
    if (!def) return "";
    if (def.kind === "unidad" ? isCountUnit(basisUnit) : isWeightOrVolumeUnit(basisUnit)) return "";
    var q = Number(sizeQty);
    if (!q || q <= 0) return "";
    return money(pricePerItem / (q * def.f)) + "/" + def.kind;
  }
  function unitPriceText(qty, amount, unit, sizeQty, sizeUnit) {
    var q = Number(qty) || 0;
    if (!q) return "";
    var per = amount / q;
    var txt = money(per) + " x " + (String(unit || "").trim() || "unidad");
    var extra = perKgText(per, sizeQty, sizeUnit, unit);
    return extra ? txt + " · " + extra : txt;
  }
